[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wander"
version = "0.1.0"
description = "Wander: a travel muse for people who do not know where to go, painted with Muse Image."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.50",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "meta-sam-parser>=0.1",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wander.web" = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
